name: _
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/allure_dart_commons
  - packages/allure_dart_test

dev_dependencies:
  # 6.1.3 needs Dart >=3.12 (package SDK constraint ^3.12.0).
  # 6.1.5 needs Dart >=3.13; stay on 6.1.3 until CI/local SDK catch up.
  dart_pre_commit: ^6.1.3

# Format-only pre-commit checks. Enable with:
#   dart run tool/setup_git_hooks.dart
dart_pre_commit:
  format: true
  analyze: false
  flutter-compat: false
  outdated: false
  pull-up-dependencies: false
  osv-scanner: false
