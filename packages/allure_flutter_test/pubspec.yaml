name: allure_flutter_test
description: Allure Report adapter for flutter_test and host-run integration_test.
version: 1.1.0
homepage: https://github.com/allure-framework/allure-dart
repository: https://github.com/allure-framework/allure-dart
issue_tracker: https://github.com/allure-framework/allure-dart/issues

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  allure_dart_commons: ^1.1.0
  allure_dart_test: ^1.1.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Version is pinned by the Flutter SDK's own flutter_test dependency, so
  # use `any` rather than a manually tracked constraint.
  leak_tracker_flutter_testing: any

dev_dependencies:
  lints: ^5.1.1
  path: ^1.9.0
