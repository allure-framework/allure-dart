name: allure_flutter_test
description: Allure Report adapter for flutter_test and host-run integration_test.
version: 1.2.0
homepage: https://github.com/allure-framework/allure-dart
repository: https://github.com/allure-framework/allure-dart
issue_tracker: https://github.com/allure-framework/allure-dart/issues

environment:
  sdk: ^3.8.0
  flutter: '>=3.24.0'

dependencies:
  allure_dart_commons: ^1.2.0
  allure_dart_test: ^1.2.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Declared for pub.dev (unconstrained `any` is rejected). Keep these wide so
  # Flutter SDK's own flutter_test pins can select the matching versions.
  leak_tracker_flutter_testing: ^3.0.0
  test_api: ^0.7.0

dev_dependencies:
  lints: ^6.1.0
  path: ^1.9.0
